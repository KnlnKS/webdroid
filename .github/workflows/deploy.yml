name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ fromJSON(vars.WEBDROID_DEPLOYMENT || '{}').frontendOrigin }}
    env:
      WEBDROID_DEPLOYMENT: ${{ vars.WEBDROID_DEPLOYMENT }}
      OCI_SECURITY_LIST_ID: ${{ vars.OCI_SECURITY_LIST_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and validate
        env:
          WEBDROID_AOSP_URL: ${{ vars.WEBDROID_AOSP_URL }}
          WEBDROID_AOSP_SHA256: ${{ vars.WEBDROID_AOSP_SHA256 }}
        run: >-
          sh scripts/build-cloudflare.sh sh -c
          'pnpm typecheck && pnpm test tests/backend.test.ts && pnpm deploy:check && pnpm aot && pnpm build:prod'
      - name: Install OCI SDK and check firewall lifecycle
        run: |
          python3 -m venv "$RUNNER_TEMP/oci-sdk"
          "$RUNNER_TEMP/oci-sdk/bin/pip" install oci==2.189.0
          "$RUNNER_TEMP/oci-sdk/bin/python" tests/deploy-firewall.test.py
          echo "$RUNNER_TEMP/oci-sdk/bin" >> "$GITHUB_PATH"
      - name: Prepare deployment credentials
        id: credentials
        env:
          OCI_CONFIG_FILE: ${{ runner.temp }}/deploy-credentials/oci-config
          OCI_KEY_FILE: ${{ runner.temp }}/deploy-credentials/oci-key.pem
          WEBDROID_SSH_KEY: ${{ runner.temp }}/deploy-credentials/ssh-key
          WEBDROID_SSH_KNOWN_HOSTS: ${{ runner.temp }}/deploy-credentials/known_hosts
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.WEBDROID_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.WEBDROID_SSH_KNOWN_HOSTS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${OCI_CONFIG:?}" "${OCI_API_KEY:?}" "${SSH_PRIVATE_KEY:?}" "${SSH_KNOWN_HOSTS:?}"
          : "${WEBDROID_DEPLOYMENT:?}" "${OCI_SECURITY_LIST_ID:?}"
          : "${CLOUDFLARE_API_TOKEN:?}" "${CLOUDFLARE_ACCOUNT_ID:?}"
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy-credentials"
          printf '%s\n' "$OCI_CONFIG" > "$OCI_CONFIG_FILE"
          printf '%s\n' "$OCI_API_KEY" > "$OCI_KEY_FILE"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$WEBDROID_SSH_KEY"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$WEBDROID_SSH_KNOWN_HOSTS"
          for name in OCI_CONFIG_FILE OCI_KEY_FILE WEBDROID_SSH_KEY WEBDROID_SSH_KNOWN_HOSTS; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
      - name: Allow runner SSH
        run: |
          runner_ip=$(curl -4 --fail --silent --show-error --retry 3 --max-time 30 https://api.ipify.org)
          python scripts/deploy-firewall.py "$runner_ip"
      - name: Deploy backend and check HTTPS health
        run: node scripts/deploy-backend.ts
      - name: Remove runner SSH
        if: always() && steps.credentials.outcome == 'success'
        run: python scripts/deploy-firewall.py
      - name: Publish Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'webdroid' }}
          CF_PAGES_BRANCH: main
        run: pnpm release
      - name: Remove credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy-credentials"
